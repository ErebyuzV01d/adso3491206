<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12-Colors-Alpha</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        div.mario {
            background: url(imgs/mario.png) no-repeat
                        center /contain;
            border: 2px solid #fff9;
            margin: 1rem auto;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            height: 400px;
            width: 300px;
            div {
                background: #fff9;
                height: 100px;
                width: 100px;
                &.box01{background-color: #ffff;}
                &.box02{background-color: #fffe;}
                &.box03{background-color: #fffd;}
                &.box04{background-color: #fffc;}
                &.box05{background-color: #fffb;}
                &.box06{background-color: #fffa;}
                &.box07{background-color: #fff9;}
                &.box08{background-color: #fff8;}
                &.box09{background-color: #fff7;}
                &.box10{background-color: #fff6;}
                &.box11{background-color: #fff5;}
                &.box12{background-color: #fff4;}
            }
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M112,56V200L40,128Z" opacity="0.2"></path><path d="M216,120H120V56a8,8,0,0,0-13.66-5.66l-72,72a8,8,0,0,0,0,11.32l72,72A8,8,0,0,0,120,200V136h96a8,8,0,0,0,0-16ZM104,180.69,51.31,128,104,75.31Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>12-Colors-Alpha</h1>
            <img src="../src/imgs/logo-css.png" alt="CSS">
            <h3>The fourth alpha channel allows you to apply opacity or transparency to the color.</h3>
        </header>
        <section>
            <h2 class="subtitle">Example:</h2>
            <div class="mario">
                <div class="box01"></div>
                <div class="box02"></div>
                <div class="box03"></div>
                <div class="box04"></div>
                <div class="box05"></div>
                <div class="box06"></div>
                <div class="box07"></div>
                <div class="box08"></div>
                <div class="box09"></div>
                <div class="box10"></div>
                <div class="box11"></div>
                <div class="box12"></div>
            </div>
        </section>
    </main>
</body>
</html>
