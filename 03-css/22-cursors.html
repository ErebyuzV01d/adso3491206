<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22-cursors</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        section{
            div{
                border: 2px solid #fff9;
                width: 360px;
                margin: 0 auto;
                height: 140px;
                &.cursor-move{cursor:move;}
                &.cursor-help{cursor:help;}
                &.cursor-crosshair{cursor:crosshair;}
                &.cursor-image{
                    cursor: url(../src/imgs/pointer.png), default;
                }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M112,56V200L40,128Z" opacity="0.2"></path><path d="M216,120H120V56a8,8,0,0,0-13.66-5.66l-72,72a8,8,0,0,0,0,11.32l72,72A8,8,0,0,0,120,200V136h96a8,8,0,0,0,0-16ZM104,180.69,51.31,128,104,75.31Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>22-cursors</h1>
            <img src="../src/imgs/logo-css.png" alt="CSS">
            <h3>Specifies the mouse cursor to be displayed when pointing over an element.</h3>
        </header>
        <section>
            <h2 class="subtitle">Move:</h2>
            <div class="cursor-move"></div>
            <h2 class="subtitle">Help:</h2>
            <div class="cursor-help"></div>
            <h2 class="subtitle">Crosshair:</h2>
            <div class="cursor-crosshair"></div>
            <h2 class="subtitle">Image (Custom):</h2>
            <div class="cursor-image"></div>
        </section>
    </main>
</body>
</html>
