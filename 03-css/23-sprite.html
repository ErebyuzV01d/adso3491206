<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>23-sprite</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        div#runner{
            background: url(../src/imgs/run-sprite.png) no-repeat;
            margin: 2rem auto;
            height: 256px;
            width: 256px;
            &.sp1{background-position: calc(-256px*0)0;;}
            &.sp2{background-position: calc(-256px*1)0;;}
            &.sp3{background-position: calc(-256px*2)0;;}
            &.sp4{background-position: calc(-256px*3)0;;}
            &.sp5{background-position: calc(-256px*4)0;;}
            &.sp6{background-position: calc(-256px*5)0;;}
        }
        div#dino{
            background: url(../src/imgs/dino-sprite.png) no-repeat;
            margin: 2rem auto;
            height: 128px;
            width: 128px;
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M112,56V200L40,128Z" opacity="0.2"></path><path d="M216,120H120V56a8,8,0,0,0-13.66-5.66l-72,72a8,8,0,0,0,0,11.32l72,72A8,8,0,0,0,120,200V136h96a8,8,0,0,0,0-16ZM104,180.69,51.31,128,104,75.31Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>23-sprite</h1>
            <img src="../src/imgs/logo-css.png" alt="CSS">
            <h3>An image sprite is a collection of images put into a single image.</h3>
        </header>
        <section>
            <h2 class="subtitle">Runner:</h2>
            <div id="runner" class="sp1"></div>
            <h2 class="subtitle">Dino:</h2>
            <div id="dino" class="sp1"></div>
        </section>
    </main>
    <script>
        const runner=document.getElementById('runner');
        const runnerSprites=6;
        let runnerCount=1;
        setInterval(() => {
            if(runnerCount==runnerSprites){
                runner.className='';
                runnerCount=1
            } else{
                runner.className='';
                runner.classList.add('sp'+ ++runnerCount);
            }
        }, 70);
    </script>
</body>
</html>
