<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-percentage-units</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        main{
            width: 100%;
            section.percentage{
                margin: 0 auto;
                width: 80%;
                div.parent{
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    div{
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        height: 50vh;
                        font-size: 3rem;
                        &.child1{
                            background-color: palevioletred;
                            width: 70%;
                        }
                        &.child2{
                            background-color: darkorchid;
                            width: 30%;
                        }
                    }
                }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M112,56V200L40,128Z" opacity="0.2"></path><path d="M216,120H120V56a8,8,0,0,0-13.66-5.66l-72,72a8,8,0,0,0,0,11.32l72,72A8,8,0,0,0,120,200V136h96a8,8,0,0,0,0-16ZM104,180.69,51.31,128,104,75.31Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>10-percentage-units</h1>
            <img src="../src/imgs/logo-css.png" alt="CSS">
            <h3>Are relative to the size of the parent element.</h3>
        </header>
        <section class="percentage">
            <h2 class="subtitle">Example:</h2>
            <div class="parent">
                <div class="child1">70%</div>
                <div class="child2">30%</div>
            </div>
        </section>
    </main>
</body>
</html>
