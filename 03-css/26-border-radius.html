<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>26-border-radius</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        section{
            div{
                border: 4px solid #fff9;
                background-color: #ab7dd999;
                height: 150px;
                margin: 0 auto;
                width: 150px;
                &.bradius1{
                    border-radius: 50%;
                }
                &.bradius2{
                    border-radius: 40px 0;
                }
                &.bradius3{
                    border-radius: 140px 0 0 140px;
                }
                &.bradius4{
                    border-radius: 140px 0 140px 140px;
                }
                &.bradius5{
                    border-radius: 80px;
                    corner-shape: squircle;
                }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M112,56V200L40,128Z" opacity="0.2"></path><path d="M216,120H120V56a8,8,0,0,0-13.66-5.66l-72,72a8,8,0,0,0,0,11.32l72,72A8,8,0,0,0,120,200V136h96a8,8,0,0,0,0-16ZM104,180.69,51.31,128,104,75.31Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>26-border-radius</h1>
            <img src="../src/imgs/logo-css.png" alt="CSS">
            <h3>Property defines the radius of the element's corners.</h3>
        </header>
        <section>
            <h2 class="subtitle">border-radius: 50%</h2>
            <div class="bradius1"></div>
            <h2 class="subtitle">border-radius: 40px 0</h2>
            <div class="bradius2"></div>
            <h2 class="subtitle">border-radius: 140px 0 0 140px</h2>
            <div class="bradius3"></div>
            <h2 class="subtitle">border-radius: 140px 0 140px 140px</h2>
            <div class="bradius4"></div>
            <h2 class="subtitle">corner-shape: squircle</h2>
            <div class="bradius5"></div>
        </section>
    </main>
</body>
</html>
