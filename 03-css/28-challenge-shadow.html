<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>28-challenge-shadow</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        figure.frame{
            height: calc(42 * 20px); /* Y:42 */
            width: calc(27 * 20px); /* X:27 */
            margin: 2 rem auto;
            zoom: 0.60;
            transition: all 0.4s ease-in;
            &:hover{
                transform: scale(1.4);
            }
        }
        div.squares{
            background: url(../src/imgs/square.png);
            opacity: 0.4;
            z-index: 2;
            margin-top: -20px;
            background-color: #cdbc9a;
            height: calc(42 * 20px); /* Y:42 */
        }
        div.smokingrat{
            background-color: #cdbc9a;
            height: 20px;
            width: 20px;
            box-shadow: 20px 0px 0 0 #cdbc9a,
                        40px 0px 0 0 #cdbc9a,
                        60px 0px 0 0 #cdbc9a,
                        80px 0px 0 0 #cdbc9a,
                        100px 0px 0 0 #cdbc9a,
                        120px 0px 0 0 #cdbc9a,
                        140px 0px 0 0 #cdbc9a,
                        160px 0px 0 0 #cdbc9a,
                        180px 0px 0 0 #cdbc9a,
                        200px 0px 0 0 #cdbc9a;
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M112,56V200L40,128Z" opacity="0.2"></path><path d="M216,120H120V56a8,8,0,0,0-13.66-5.66l-72,72a8,8,0,0,0,0,11.32l72,72A8,8,0,0,0,120,200V136h96a8,8,0,0,0,0-16ZM104,180.69,51.31,128,104,75.31Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>28-Challenge-Shadow</h1>
            <img src="../src/imgs/logo-css.png" alt="CSS">
            <h3>Pixel Art Smoking Rat</h3>
        </header>
        <section>
            <h2 class="subtitle">Smoking Rat:</h2>
            <figure class="frame">
                <div class="smokingrat"></div>
                <div class="squares"></div>
            </figure>
        </section>
    </main>
</body>
</html>
